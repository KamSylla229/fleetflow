{% extends "base.html" %}

{% block titre %}{{ titre }} — FleetFlow{% endblock %}
{% block titre_page %}{{ titre }}{% endblock %}

{% block contenu %}
<div class="row">
  <div class="col-lg-7">
    <div class="ff-carte">
      <div class="ff-carte__corps">
        <form method="post">
          {% csrf_token %}
          {% include "partials/_champs_formulaire.html" %}
          <div class="ff-formulaire-actions">
            <button type="submit" class="ff-btn ff-btn--principal">Enregistrer</button>
            <a class="ff-btn ff-btn--secondaire"
               href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'fleet:chauffeur_liste' %}{% endif %}">
              Annuler
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
